---
- name: Setup Jenkins and Docker on Ubuntu
  hosts: servers
  become: yes

  vars:
    java_package: openjdk-21-jre
    jenkins_key_url: "https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key"

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install prerequisite packages
      apt:
        name:
          - gnupg
          - software-properties-common
          - curl
          - ca-certificates
          - fontconfig
        state: present

    # --- DOCKER SECTION ---
    - name: Install Docker
      apt:
        name: docker.io
        state: present

    - name: Ensure Docker is started
      service:
        name: docker
        state: started
        enabled: yes

    # --- JAVA SECTION ---
    - name: Install Java 21 required for Jenkins
      apt:
        name: "{{ java_package }}"
        state: present

    # --- JENKINS CLEANUP ---
    - name: Remove old Jenkins repository file
      file:
        path: /etc/apt/sources.list.d/jenkins.list
        state: absent

    - name: Remove old Jenkins keyring file
      file:
        path: /usr/share/keyrings/jenkins-keyring.gpg
        state: absent

    - name: Create apt keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Jenkins 2026 GPG key
      get_url:
        url: "{{ jenkins_key_url }}"
        dest: /etc/apt/keyrings/jenkins-keyring.asc
        mode: '0644'
        force: yes

    - name: Add Jenkins Repository
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
        state: present
        filename: jenkins
        update_cache: yes

    - name: Install Jenkins
      apt:
        name: jenkins
        state: present

    - name: Ensure Jenkins is started
      service:
        name: jenkins
        state: started
        enabled: yes

    # --- PERMISSIONS ---
    - name: Add jenkins user to docker group
      user:
        name: jenkins
        groups: docker
        append: yes
